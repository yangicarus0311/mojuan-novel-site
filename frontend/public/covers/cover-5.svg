<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:##2a1a0a" />
      <stop offset="100%" style="stop-color:##5a3a1a" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0);stop-opacity:0" />
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.6);stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="120" fill="rgba(255,255,255,0.03)" />
  <circle cx="50" cy="460" r="80" fill="rgba(255,255,255,0.02)" />

  <!-- Icon -->
  <text x="200" y="200" text-anchor="middle" font-size="72">🏮</text>

  <!-- Title -->
  <text x="200" y="350" text-anchor="middle" font-family="serif" font-size="36" font-weight="bold" fill="#e8e4dc" letter-spacing="4">我在异界开客栈</text>

  <!-- Decorative line -->
  <line x1="120" y1="370" x2="280" y2="370" stroke="rgba(201,169,110,0.5)" stroke-width="1" />

  <!-- Author -->
  <text x="200" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="rgba(201,169,110,0.7)" letter-spacing="2">逍遥散人</text>

  <!-- Bottom category bar -->
  <rect x="0" y="520" width="400" height="40" fill="rgba(0,0,0,0.3)" rx="0" />
  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">墨卷 · 沉浸式阅读</text>
</svg>